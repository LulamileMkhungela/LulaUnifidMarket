<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lula ProVeri — Real work near you. Verified pros. Escrow-protected money.</title>
  <meta name="description" content="📍 In South Africa, for South Africa 🇿🇦 · Connecting local businesses with home owners. Browse real work pros have done near you, message them about it, and pay into escrow until you confirm the job is done. Reshaping the future of employment.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1512" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="mask-icon" href="/icons/icon-192.png" color="#0E7C5A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ProVeri">
  <meta property="og:site_name" content="Lula ProVeri">
  <meta property="og:title" content="Lula ProVeri — see the work before you hire">
  <meta property="og:description" content="📍 In South Africa, for South Africa 🇿🇦 · Home owners browse real jobs done near them and reach out to the pro who did them. Money stays in escrow until the work is confirmed.">
  <meta property="og:image" content="/icons/og-card.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="preload" href="/js/app.js" as="script">
</head>
<body>
  <div id="app-shell">
    <header id="app-header">
      <a class="brand" href="/" data-link>
        <img src="/icons/icon-192.png" alt="" width="32" height="32">
        <span>Lula ProVeri<small>South Africa · real work, real pros</small></span>
      </a>
      <span class="spacer"></span>
      <span id="conn-pill" class="conn" title="Connectivity">●</span>
      <button class="head-btn" id="btn-notifications" aria-label="Notifications" title="Notifications"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.4 9.6a5.6 5.6 0 1 1 11.2 0c0 4.6 1.8 5.8 1.8 5.8H4.6s1.8-1.2 1.8-5.8"/><path d="M10.2 19.4a1.9 1.9 0 0 0 3.6 0"/></svg><span class="dot" id="notif-dot" hidden></span></button>
      <button class="head-btn" id="btn-profile" aria-label="You" title="You"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.6 20.4c1.4-3.7 4.4-5.6 7.4-5.6s6 1.9 7.4 5.6"/></svg></button>
    </header>

    <main id="app-main" role="main" aria-live="polite"></main>

    <nav id="app-nav" aria-label="Primary">
      <button data-nav="/" aria-label="Home"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 3.4l8.5 7.2"/><path d="M5.6 9.4V20a1 1 0 0 0 1 1h10.8a1 1 0 0 0 1-1V9.4"/></svg></span>Home</button>
      <button data-nav="/browse" aria-label="Browse work near you"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.6"/><path d="m16 16 4.6 4.6"/></svg></span>Browse</button>
      <span class="fab-slot" aria-hidden="true"></span>
      <button data-nav="/orders" aria-label="My orders and jobs"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h11v18l-1.9-1.4L13.7 21l-1.7-1.4L10.3 21l-1.9-1.4L6.5 21Z"/><path d="M9.5 8h5M9.5 12h5"/></svg></span>Orders</button>
      <button data-nav="/me" aria-label="You"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.6 20.4c1.4-3.7 4.4-5.6 7.4-5.6s6 1.9 7.4 5.6"/></svg></span>You</button>
    </nav>
    <button id="fab" aria-label="Post a job or upload your work" title="Post a job or upload your work"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
  </div>

  <div id="sheet-backdrop"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Dialog"></div>
  <div id="toasts" aria-live="assertive"></div>

  <noscript>
    <div style="padding:30px;font-family:sans-serif">
      <h1>Lula ProVeri</h1>
      <p>This marketplace is a progressive web app and needs JavaScript. Everything the studio publishes, by contrast, is plain server-rendered HTML and works without it:</p>
      <ul>
        <li><a href="/api/portfolio">The work feed</a> — past jobs published by local pros, proven ones first</li>
        <li><a href="/sites">Business sites gallery</a> — every published site, each with a working booking form</li>
        <li><a href="/api/webstudio/microsites">Free pro microsites</a> — generated from the verified profile and audit ledger</li>
      </ul>
    </div>
  </noscript>

  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/screens-market.js" defer></script>
  <script src="/js/screens-shop.js" defer></script>
  <script src="/js/screens-work.js" defer></script>
  <script src="/js/screens-verticals.js" defer></script>
  <script src="/js/screens-studio.js" defer></script>
  <script src="/js/screens-trust.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
